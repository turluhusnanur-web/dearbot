<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>DearBot</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
    <div class="header">
        <div class="robot">
            🐰
        </div>
        <div>
            <h1>DearBot</h1>
            <p>your pixel AI friend</p>
        </div>
    </div>


    
 <div class="mood-container">
        <button class="mood-btn" onclick="changeMood('Enerjik ✨', this)">Enerjik ✨</button>
        <button class="mood-btn" onclick="changeMood('Uykulu ☕', this)">Uykulu ☕</button>
        <button class="mood-btn" onclick="changeMood('Filozof 📚', this)">Filozof 📚</button>
        <button class="mood-btn" onclick="changeMood('Alıngan 💅', this)">Alıngan 💅</button>
    </div>

    <div id="messages" class="messages">
        <div class="bot message">
            ✨ Merhaba! Ben DearBot.
            <br>
            Senin pixel arkadaşınım 🤍
        </div>
    </div>

    <div class="typing" id="typing">
        DearBot yazıyor...
        <span>.</span>
        <span>.</span>
        <span>.</span>
    </div>

<div class="input-area">
        <input id="input" placeholder="Bir şey yaz..." autocomplete="off">
        <button onclick="sendMessage()">➤</button>
    </div>

   
</div>

<script>
let currentActiveMood = null; // Şu an hangi modun aktif olduğunu hafızada tutuyoruz

async function changeMood(selectedMood, buttonElement) {
    let messages = document.getElementById("messages");
    
    // Eğer zaten aktif olan moda tekrar basıldıysa, modu iptal et ve normale dön!
    if (currentActiveMood === selectedMood) {
        currentActiveMood = null;
        
        // Tüm mod butonlarının aktiflik (pembe) stilini temizle
        document.querySelectorAll('.mood-btn').forEach(btn => btn.classList.remove('active'));
        
        // Arka plana "Normal" moda dönmesi için istek gönder
        await fetch("/set_mood", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mood: "Normal" })
        });
        
        messages.innerHTML += `
            <div class="bot message" style="background: #fff; border-style: dashed; color: #5c3b58;">
                ⚙️ System: DearBot fabrika ayarlarına (Normal moda) geri döndü!
            </div>
        `;
        messages.scrollTop = messages.scrollHeight;
        return;
    }

    // Yeni bir moda basıldıysa: Önce eski aktif butonların pembeliğini temizle
    document.querySelectorAll('.mood-btn').forEach(btn => btn.classList.remove('active'));
    
    // Şimdi sadece bu basılan butonu aktif (pembe) yap
    buttonElement.classList.add('active');
    currentActiveMood = selectedMood;

    // Python'a yeni modu bildir
    let response = await fetch("/set_mood", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mood: selectedMood })
    });
    
    messages.innerHTML += `
        <div class="bot message" style="background: #fff; border-style: dashed; color: #8b4f7d;">
            ⚙️ System: DearBot artık "${selectedMood}" modunda!
        </div>
    `;
    messages.scrollTop = messages.scrollHeight;
}
    
async function sendMessage(){
    let input = document.getElementById("input");
    let text = input.value.trim();
    
  // TXT GİZLİ KODU (SARI - MAVİ KONSEPTİ)
    if (text.toLowerCase() === "txt") {
        let messages = document.getElementById("messages");
        
        messages.innerHTML += `<div class="user message">${text}</div>`;
        input.value = "";
        
        let sendButton = document.querySelector(".input-area button");
        
        document.body.style.backgroundColor = "#ffdb00"; 
        if (sendButton) { sendButton.style.backgroundColor = "#ffdb00"; } 
        
        document.querySelector(".app").style.borderColor = "#31c8ff"; 
        document.querySelector("h1").style.color = "#31c8ff"; 
        
        let headerDiv = document.querySelector(".header div:last-child");
        if (!document.getElementById("one-dream-text")) {
            headerDiv.innerHTML += `
                <div id="one-dream-text" style="color: #31c8ff; font-size: 16px; margin-top: 8px;">
                    One Dream!
                </div>
            `;
        }
        
        setTimeout(() => {
            messages.innerHTML += `
                <div class="bot message" style="background: #fff7fc; border-color: #31c8ff;">
                    🐰 +×+ dünyasına hoş geldin! ✨
                </div>
            `;
            messages.scrollTop = messages.scrollHeight;
            
            setTimeout(() => {
                document.body.style.backgroundColor = "#ffdff2";
                if (sendButton) { sendButton.style.backgroundColor = "#ff9fca"; } 
                document.querySelector(".app").style.borderColor = "#5c3b58";
                document.querySelector("h1").style.color = "#8b4f7d";
                
                let dreamText = document.getElementById("one-dream-text");
                if (dreamText) { dreamText.remove(); }
            }, 5000);
            
        }, 400);
        
        return; 
    }
    
    if(text === ""){ return; }
    let messages = document.getElementById("messages");
    messages.innerHTML += `<div class="user message">${text}</div>`;
    input.value="";
    let typing = document.getElementById("typing");
    typing.style.display="block";

    let response = await fetch("/chat",{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({ message:text })
    });

    let data = await response.json();
    typing.style.display="none";
    messages.innerHTML += `<div class="bot message">🤖 ${data.reply}</div>`;
    messages.scrollTop = messages.scrollHeight;
}

document.getElementById("input").addEventListener("keydown",function(event){
    if(event.key==="Enter"){ sendMessage(); }
});
</script>
</body>
</html>
