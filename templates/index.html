<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>DearBot</title>

    <link rel="stylesheet" href="/static/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>


<body>

<div class="app">


    <div class="header">

        <div class="robot">
            🤖
        </div>

        <div>
            <h1>DearBot</h1>
            <p>your pixel AI friend</p>
        </div>

    </div>

<!-- MOD SEÇİM BUTONLARI -->
    <div class="mood-container">
        <button class="mood-btn" onclick="changeMood('Enerjik ✨')">Enerjik ✨</button>
        <button class="mood-btn" onclick="changeMood('Uykulu ☕')">Uykulu ☕</button>
        <button class="mood-btn" onclick="changeMood('Filozof 📚')">Filozof 📚</button>
        <button class="mood-btn" onclick="changeMood('Alıngan 💅')">Alıngan 💅</button>
    </div>

    <div id="messages" class="messages">

        <div class="bot message">
            ✨ Merhaba! Ben DearBot.
            <br>
            Senin pixel arkadaşınım 🤍
        </div>

    </div>



    <div class="typing" id="typing">
        DearBot yazıyor...
        <span>.</span>
        <span>.</span>
        <span>.</span>
    </div>



    <div class="input-area">

        <input 
        id="input"
        placeholder="Bir şey yaz..."
        autocomplete="off">


        <button onclick="sendMessage()">
            ➤
        </button>

    </div>



</div>




<script>


async function sendMessage(){


let input = document.getElementById("input");

let text = input.value.trim();


if(text === ""){
    return;
}
async function changeMood(selectedMood) {
    // Tıklanan butonu bulalım (içindeki yazıya göre)
    let buttons = document.querySelectorAll(".mood-btn");
    let clickedButton = Array.from(buttons).find(btn => btn.innerText === selectedMood);
    
    let targetMood = selectedMood;
    let systemText = "";

    // EĞER TIKLANAN BUTON ZATEN AKTİFSE (Kullanıcı modu kapatmak istiyor)
    if (clickedButton.classList.contains("active-mood")) {
        clickedButton.classList.remove("active-mood");
        targetMood = null; // Python'a boş gönderiyoruz ki normal moda dönsün
        systemText = `⚙️ System: DearBot "Normal" moda geri döndü.`;
    } else {
        // Önce diğer tüm butonlardaki aktifliği kaldıralım (aynı anda sadece bir mod açılabilir)
        buttons.forEach(btn => btn.classList.remove("active-mood"));
        
        // Şimdi sadece tıkladığımız butonu aktif yapalım
        clickedButton.classList.add("active-mood");
        systemText = `⚙️ System: DearBot artık "${selectedMood}" modunda!`;
    }

    // Arka plana yeni durumu bildiriyoruz
    let response = await fetch("/set_mood", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ mood: targetMood })
    });
    
    let data = await response.json();
    
    // Ekrana sistem mesajını yazdıralım (eski mesajları silmeden alta ekler)
    let messages = document.getElementById("messages");
    messages.innerHTML += `
        <div class="bot message" style="background: #fff; border-style: dashed; color: #8b4f7d;">
            ${systemText}
        </div>
    `;
    messages.scrollTop = messages.scrollHeight;
}


let messages = document.getElementById("messages");



messages.innerHTML +=
`
<div class="user message">
${text}
</div>
`;



input.value="";



let typing = document.getElementById("typing");

typing.style.display="block";



let response = await fetch("/chat",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

message:text

})

});



let data = await response.json();



typing.style.display="none";



messages.innerHTML +=
`
<div class="bot message">
🤖 ${data.reply}
</div>
`;



messages.scrollTop = messages.scrollHeight;


}




document.getElementById("input")
.addEventListener("keydown",function(event){

if(event.key==="Enter"){

sendMessage();

}

});


</script>


</body>

</html>
